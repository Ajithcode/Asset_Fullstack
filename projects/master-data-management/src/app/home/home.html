<section class="mdm-landing">
  <header class="mdm-landing__header">
    <h1>Master Data Management</h1>
    <p>Reference data shared by every module. Pick an area to manage.</p>
  </header>

  <div class="mdm-cards">
    @for (group of groups; track group.slug) {
      <a class="mdm-card" [routerLink]="group.slug">
        <span class="mdm-card__title">{{ group.label }}</span>
        <span class="mdm-card__text">{{ group.description }}</span>
        <span class="mdm-card__meta">{{ group.items.length }} masters</span>
      </a>
    }
  </div>
</section>
