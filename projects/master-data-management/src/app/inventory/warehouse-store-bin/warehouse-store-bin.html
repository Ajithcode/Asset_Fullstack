<nav class="crumbs" aria-label="Breadcrumb">
  <a [routerLink]="basePath">Master Data Management</a>
  <span aria-hidden="true">›</span>
  <a [routerLink]="basePath + '/inventory'">Inventory</a>
  <span aria-hidden="true">›</span>
  <strong>Warehouse / Store / Bin</strong>
</nav>

<header class="head">
  <span class="head__icon"><lucide-icon [img]="icons.Warehouse" [size]="24"></lucide-icon></span>
  <div class="head__text">
    <h1>Warehouse / Store / Bin</h1>
    <p>Manage warehouses, stores and bins for inventory storage locations.</p>
  </div>
  <button type="button" class="btn btn--primary head__add" (click)="list?.addNew()">
    <lucide-icon [img]="icons.Plus" [size]="16"></lucide-icon> Add {{ noun }}
  </button>
</header>

<nav class="sub-tabs" role="tablist">
  @for (t of tabs; track t.id) {
    <button type="button" role="tab" [class.active]="tab === t.id" [attr.aria-selected]="tab === t.id" (click)="show(t.id)">{{ t.label }}</button>
  }
</nav>

@switch (tab) {
  @case ('warehouse') { <app-warehouse-list #list (showStores)="showStoresOf($event)"></app-warehouse-list> }
  @case ('store') { <app-store-list #list [warehouseFilter]="warehouseFilter" (showBins)="showBinsOf($event)"></app-store-list> }
  @case ('bin') { <app-bin-list #list [storeFilter]="storeFilter"></app-bin-list> }
}
