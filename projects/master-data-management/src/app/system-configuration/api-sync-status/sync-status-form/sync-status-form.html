<aside class="drawer" role="dialog" aria-labelledby="sync-form-title">
  <header class="drawer__header">
    <h2 id="sync-form-title">{{ isEdit ? 'Edit Sync Status' : 'Add Sync Status' }}</h2>
    <button type="button" class="drawer__close" (click)="cancelled.emit()" aria-label="Close">
      <lucide-icon [img]="icons.X" [size]="18"></lucide-icon>
    </button>
  </header>

  <form class="drawer__body" (ngSubmit)="submit()" novalidate>
    <div class="field" [class.invalid]="errors['name']">
      <label for="sync-name"><span class="req">*</span> Status Name</label>
      <input id="sync-name" name="name" placeholder="Enter status name" [(ngModel)]="form.name" />
      @if (errors['name']) { <small>{{ errors['name'] }}</small> }
    </div>
    <div class="field" [class.invalid]="errors['code']">
      <label for="sync-code"><span class="req">*</span> Code</label>
      <input id="sync-code" name="code" placeholder="Enter unique code" [(ngModel)]="form.code" />
      @if (errors['code']) { <small>{{ errors['code'] }}</small> }
    </div>
    <div class="field">
      <label for="sync-desc">Description</label>
      <textarea id="sync-desc" name="description" rows="3" placeholder="Enter description" [(ngModel)]="form.description"></textarea>
    </div>
    <div class="field">
      <span class="field__label">Color</span>
      <div class="swatches" role="radiogroup" aria-label="Colour">
        @for (c of colors; track c) {
          <button type="button" class="swatch" role="radio" [style.background]="c" [class.on]="form.color === c" [attr.aria-checked]="form.color === c" [attr.aria-label]="'Colour ' + c" (click)="form.color = c"></button>
        }
      </div>
    </div>
    <div class="field">
      <label for="sync-success">Is Success Status</label>
      <input id="sync-success" class="switch" type="checkbox" name="isSuccess" [(ngModel)]="form.isSuccess" />
      <small class="hint">Records in a success status count as synced in reports.</small>
    </div>
    <div class="field">
      <label for="sync-status"><span class="req">*</span> Status</label>
      <div class="status-select">
        <i [attr.data-status]="form.status"></i>
        <select id="sync-status" name="status" [(ngModel)]="form.status">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>
    </div>

    <footer class="drawer__footer">
      <button type="button" class="btn btn--ghost" (click)="cancelled.emit()">Cancel</button>
      <button type="submit" class="btn btn--primary">Save</button>
    </footer>
  </form>
</aside>
