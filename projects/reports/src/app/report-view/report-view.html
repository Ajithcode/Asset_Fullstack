<div class="rv-page">
  <div class="rv-breadcrumb">
    <a (click)="backToReports()">Reports</a>
    <span class="rv-breadcrumb-sep">&raquo;</span>
    <span>View</span>
    <span class="rv-breadcrumb-sep">&raquo;</span>
    <span class="rv-breadcrumb-current">{{ report?.title || 'Report' }}</span>
  </div>

  <div class="lh-container" *ngIf="report; else notFound">
    <div class="lh-header">
      <h1 class="lh-title">{{ report.title }}</h1>

      <div class="icon-toolbar">
        <button class="icon-btn" title="Download" (click)="onDownload()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v13"></path>
            <path d="M6 12l6 6 6-6"></path>
            <path d="M5 21h14"></path>
          </svg>
        </button>
        <button class="icon-btn" title="Refresh" (click)="onRefresh()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <path d="M21 4v5h-5"></path>
          </svg>
        </button>

        <div class="column-picker-wrap">
          <button class="icon-btn" title="Choose columns" (click)="$event.stopPropagation(); toggleColumnPicker()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="5" height="16" rx="1"></rect>
              <rect x="9.5" y="4" width="5" height="16" rx="1"></rect>
              <rect x="16" y="4" width="5" height="16" rx="1"></rect>
            </svg>
          </button>

          <div class="column-picker-panel" *ngIf="showColumnPicker" (click)="$event.stopPropagation()">
            <div class="column-picker-title">Show columns</div>
            <label class="column-picker-item" *ngFor="let col of columns">
              <input type="checkbox" [checked]="col.visible" (change)="toggleColumn(col)" />
              <span>{{ col.label }}</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="table-wrapper">
      <table class="lh-table">
        <thead>
          <tr>
            <ng-container *ngFor="let col of columns">
              <th *ngIf="col.visible">{{ col.label }}</th>
            </ng-container>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of report.rows">
            <ng-container *ngFor="let col of columns">
              <td *ngIf="col.visible">{{ cell(row, col.key) }}</td>
            </ng-container>
          </tr>

          <tr *ngIf="report.rows.length === 0">
            <td [attr.colspan]="visibleColumnCount || 1" class="empty-row">No data available for this report.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <ng-template #notFound>
    <div class="lh-container">
      <p class="empty-row">Report not found. <a (click)="backToReports()">Back to Reports</a></p>
    </div>
  </ng-template>
</div>
