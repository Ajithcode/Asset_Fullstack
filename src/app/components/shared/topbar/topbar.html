<div class="topbar-shell">
  <button class="menu-toggle" type="button" (click)="toggleMenu()" aria-label="Toggle menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    </svg>
  </button>

  <div class="brand"><p class="brand-text">Asset<span class="brand-highlight">360</span></p></div>

  <div class="topbar-spacer"></div>

  <button class="email-btn" type="button" aria-label="Messages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="4" width="20" height="16" rx="2" />
      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
    </svg>
  </button>

  <button class="notification-btn" type="button" aria-label="Notifications" (click)="toggleNotifications($event.currentTarget)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>
    <span *ngIf="unreadNotificationCount > 0">{{ unreadNotificationCount }}</span>
  </button>

  <div class="admin-chip" (click)="toggleAdminDropdown($event.currentTarget)">
    <div class="avatar">{{ initials }}</div>
    <div>
      <strong>{{ displayEmail }}</strong>
      <span>{{ roleName }}</span>
    </div>
    <b>v</b>
  </div>
</div>

<!-- Admin dropdown flyout -->
<div
  class="admin-flyout"
  *ngIf="isDropdownOpen && flyoutPosition"
  [style.top.px]="flyoutPosition!.top"
  [style.left.px]="flyoutPosition!.left"
  (click)="$event.stopPropagation()"
>
  <div class="flyout-user-info">
    <div class="flyout-avatar">{{ initials }}</div>
    <div class="flyout-user-details">
      <strong>{{ displayEmail }}</strong>
      <span>{{ roleName }}</span>
    </div>
  </div>
  <button type="button" class="flyout-item" (click)="logout()">Logout</button>
</div>

<!-- 7. Notifications flyout (2.7 Notifications & Escalations) -->
<div
  class="notifications-flyout"
  *ngIf="isNotificationsOpen && notificationsFlyoutPosition"
  [style.top.px]="notificationsFlyoutPosition!.top"
  [style.left.px]="notificationsFlyoutPosition!.left"
  (click)="$event.stopPropagation()"
>
  <div class="notifications-header">
    <strong>Notifications</strong>
    <button type="button" class="mark-read-btn" (click)="markAllNotificationsRead()">Mark all read</button>
  </div>
  <div class="notifications-list">
    <button
      type="button"
      class="notification-item"
      *ngFor="let n of notifications"
      [class.unread]="!n.read"
      (click)="openNotification(n)"
    >
      <span class="notification-dot" [attr.data-level]="n.level"></span>
      <span class="notification-body">
        <span class="notification-message">{{ n.message }}</span>
        <span class="notification-time">{{ n.timestamp }}</span>
      </span>
    </button>
    <div class="notifications-empty" *ngIf="notifications.length === 0">You're all caught up.</div>
  </div>
</div>
