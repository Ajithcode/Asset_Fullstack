
<div class="layout-shell">
  <app-sidebar (collapsedChange)="onCollapseChange($event)"></app-sidebar>
  <div class="main-area">
    <!-- Sticky bar with the page background, so content does not show around the rounded topbar when scrolling -->
    <div class="topbar-bar">
      <app-topbar (toggleSidebar)="onToggleSidebar()"></app-topbar>
    </div>
    <main class="layout-content" #content>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
