<!-- Full-width topbar (logo, menu button, actions); the sidebar and the page sit below it -->
<div class="topbar-bar">
  <app-topbar [sidebarCollapsed]="collapsed" (toggleSidebar)="onToggleSidebar()"></app-topbar>
</div>
<div class="layout-shell">
  <app-sidebar [collapsed]="collapsed" (collapsedChange)="onCollapseChange($event)"></app-sidebar>
  <div class="main-area">
    <main class="layout-content" #content>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
