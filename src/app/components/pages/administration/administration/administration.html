<div class="admin-container">
  <h2 class="admin-title">Administration</h2>
  <p class="admin-intro">Manage your organization, users, access and system settings.</p>

  <nav class="admin-grid" aria-label="Administration modules">
    @for (m of modules; track m.slug) {
      <a class="admin-card" [routerLink]="basePath + '/' + m.slug">
        <strong>{{ m.label }}</strong>
        <span>{{ m.description }}</span>
      </a>
    }
  </nav>
</div>
