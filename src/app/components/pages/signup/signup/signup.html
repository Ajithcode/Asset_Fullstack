<div class="login-shell">
  <aside class="branding-panel">
    <div class="brand-top">
      <div class="brand-mark brand-logo">
        <img src="/purple360-logo.jpeg" alt="Asset360 by Purple IQ" />
      </div>
      <h1>Welcome to Assets 360</h1>
      <p class="brand-subtitle">TRACK. MANAGE. OPTIMIZE. PROTECT.</p>
    </div>

    <div class="brand-features">
      <div class="feature-item">Asset Tracking & Inventory</div>
      <div class="feature-item">Real-time Location</div>
      <div class="feature-item">Maintenance Scheduling</div>
      <div class="feature-item">Asset Lifecycle Management</div>
    </div>
  </aside>

  <section class="login-panel">
    <div class="login-card">
      <div class="icon-shell logo-shell">
        <img src="/purple360-logo.jpeg" alt="Asset360 by Purple IQ" />
      </div>

      <p class="login-subtitle">Create your Assets 360 account</p>

      <form (ngSubmit)="signup()" class="login-form" novalidate>
        <label class="field-label">
          <span>Full Name *</span>
          <input type="text" [(ngModel)]="form.fullName" name="fullName" placeholder="Enter your full name" autocomplete="name" maxlength="100" />
        </label>

        <label class="field-label">
          <span>Username *</span>
          <input type="text" [(ngModel)]="form.userName" name="userName" placeholder="Choose a username" autocomplete="username" maxlength="50" />
        </label>

        <label class="field-label">
          <span>Email *</span>
          <input type="email" [(ngModel)]="form.email" name="email" placeholder="you@company.com" autocomplete="email" maxlength="120" />
        </label>

        <label class="field-label">
          <span>Contact Number</span>
          <input type="tel" [(ngModel)]="form.contactNo" name="contactNo" placeholder="Optional" autocomplete="tel" maxlength="20" />
        </label>

        <label class="field-label">
          <span>Role *</span>
          <select [(ngModel)]="form.userRoleId" name="userRoleId" [disabled]="rolesLoading || !roles.length">
            <option value="" disabled>{{ rolesLoading ? 'Loading roles...' : roles.length ? 'Select a role' : 'No roles available' }}</option>
            <option *ngFor="let r of roles" [value]="r.roleId">{{ r.roleName }}</option>
          </select>
          <small *ngIf="selectedRole?.description" class="field-hint">{{ selectedRole?.description }}</small>
          <small *ngIf="rolesError" class="field-hint field-hint--error">
            {{ rolesError }} <button type="button" class="link-button" (click)="loadRoles()">Retry</button>
          </small>
          <small *ngIf="!rolesLoading && !rolesError && !roles.length" class="field-hint field-hint--error">
            No roles exist yet. An administrator needs to create one first.
          </small>
        </label>

        <label class="field-label">
          <span>Password *</span>
          <input type="password" [(ngModel)]="form.password" name="password" placeholder="At least 8 characters" autocomplete="new-password" />
        </label>

        <label class="field-label">
          <span>Confirm Password *</span>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" />
        </label>

        <p *ngIf="errorMsg" class="error-msg" role="alert">{{ errorMsg }}</p>

        <button type="submit" class="submit-button" [disabled]="isLoading">
          {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
        </button>
      </form>

      <p class="switch-auth">
        Already have an account?
        <a routerLink="/login">Sign In</a>
      </p>

      <div class="secure-note">Secured &amp; Encrypted Connection</div>
    </div>
  </section>
</div>
