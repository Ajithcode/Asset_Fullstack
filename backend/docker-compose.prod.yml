# Runs the backend on a Linux server, behind Caddy for automatic HTTPS.
# Setup: copy .env.production.example to .env and fill it in, point DOMAIN's DNS at this server, then
#   docker compose -f docker-compose.prod.yml up -d --build
# API: https://$DOMAIN  (Swagger: https://$DOMAIN/swagger)
name: asset360-prod  # separate from docker-compose.local.yml, so both can exist on one machine
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      # Media service saves uploads under its working directory; keep them across restarts and redeploys.
      - media-uploads:/app/media/uploads
    expose:
      - "5296"
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  media-uploads:
  caddy-data:
  caddy-config:
