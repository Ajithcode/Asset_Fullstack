name = "asset360-backend"
main = "worker/index.js"
compatibility_date = "2026-01-01"

[[containers]]
class_name = "AssetContainer"
image = "./Dockerfile"
max_instances = 1
instance_type = "standard-1"

[[durable_objects.bindings]]
name = "ASSET_CONTAINER"
class_name = "AssetContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AssetContainer"]
