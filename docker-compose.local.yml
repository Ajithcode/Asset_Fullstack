# Runs the whole backend locally in Docker, from the same image that is deployed to Cloudflare.
# Docker avoids Windows Smart App Control, which blocks freshly built DLLs when run directly on Windows.
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d --build
# Gateway: http://localhost:5296/swagger
# Each microservice is also published on its own port, so the frontend modules call their service directly
# (see assets360-angular/src/environments/environment.ts). Every service checks the sign-in token and the caller's
# role permissions itself (A360.Security access guard), so skipping the gateway doesn't skip access control.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Development: without SMTP settings the login OTP is written to the container log instead of emailed.
      ASPNETCORE_ENVIRONMENT: Development
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env.local}
      # Media builds file links from this: the Media service's own published port
      BaseUrl: http://localhost:5300
    ports:
      - "5296:5296" # API gateway
      - "5300:5300" # Media (uploads)
      - "5401:5401" # Asset
      - "5410:5410" # Inspection
      - "5430:5430" # Maintenance
      - "5440:5440" # WIP / Operations
      - "5450:5450" # Workflows
      - "5460:5460" # Administration
      - "5470:5470" # Dashboard
      - "5480:5480" # Report Analytics
      - "5490:5490" # Tracking & IoT
      - "5500:5500" # Master Data Management
      # Not published, reachable only through the gateway:
      # - UserAccount (5018): the gateway exposes only its sign-in routes (/api/auth); its own user / role endpoints
      #   must stay internal (Administration calls them inside the container)
      # - EventLog (5420): has no sign-in check of its own
    restart: unless-stopped
